services:
  - type: web
    name: voice-assistant-api
    runtime: docker
    repo: https://github.com/your-username/voice-bot-restaurants
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voiceassistant
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: "whatsapp:+14155238886"
      - key: COOK_WHATSAPP_NUMBER
        value: "whatsapp:+441252438046"
    healthCheckPath: /health/

databases:
  - name: voiceassistant
    plan: starter
    databaseName: voiceassistant_4s2c
    user: voiceassistant_4s2c_user
