name: Keep Render App Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        # Replace the URL below with your actual Render URL or use GitHub Secrets
        # Example: curl -sSf https://your-app-name.onrender.com/health/ > /dev/null
        run: curl -sSf ${{ secrets.RENDER_APP_URL }}/health/ > /dev/null || echo "Ping failed"
