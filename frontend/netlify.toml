[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/auth/*"
  to = "https://your-render-backend.onrender.com/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://your-render-backend.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
